<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>L'autel</title>
  <link rel="icon" href="data:,">
  <style>* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #171519; color: #fff6e9; font-family: Georgia, serif; }
canvas { display: block; width: 100vw; height: 100vh; }
#game { position: fixed; inset: 0; }
#prompt, #loading, #message { position: fixed; left: 50%; transform: translateX(-50%); text-align: center; }
#loading, #message { text-shadow: 0 2px 12px #000, 0 1px 4px #000; pointer-events: none; }
#intro { position: fixed; z-index: 2; inset: 0; display: grid; place-items: center; background: #000; }
#start { background: transparent; color: white; border: 1px solid #fff9; padding: 12px 32px; font: 23px Georgia, serif; }
#start:not(:disabled):hover { background: #ffffff17; border-color: white; }
#start:not(:disabled):active { background: #ffffff29; }
#start:disabled { opacity: .55; cursor: wait; }
#prompt { bottom: 14%; color: #fff; padding: 9px 18px; border: 1px solid #ffdc9c6a; white-space: nowrap; }
#loading { top: calc(50% + 47px); width: min(84vw, 270px); color: #fff; font: 14px/1.4 system-ui, sans-serif; }
#load-progress { display: block; width: 100%; height: 6px; margin: 0 0 10px; appearance: none; border: 0; border-radius: 4px; overflow: hidden; background: #303030; }
#load-progress::-webkit-progress-bar { background: #303030; }
#load-progress::-webkit-progress-value { background: #eee; }
#load-progress::-moz-progress-bar { background: #eee; }
#load-progress:indeterminate { background: linear-gradient(90deg, #303030 30%, #eee 50%, #303030 70%) 100% 0 / 250% 100%; animation: load-sweep 1.55s linear infinite; }
#load-progress:indeterminate::-webkit-progress-bar { background: transparent; }
#load-progress:indeterminate::-moz-progress-bar { background: transparent; }
@keyframes load-sweep { to { background-position: -65% 0; } }
@media (prefers-reduced-motion: reduce) { #load-progress:indeterminate { animation: none; } }
#message { top: 55%; width: min(89%, 760px); padding: 18px 24px; border-radius: 9px; font-size: clamp(18px, 2.4vw, 27px); line-height: 1.5; }
#prompt, #message { background: #0008; backdrop-filter: blur(9px); box-shadow: 0 0 32px 8px #0004; }
#prayer { position: fixed; inset: 0; display: flex; justify-content: center; align-items: end; padding: 12px 12px min(6vh, 45px); background: linear-gradient(transparent 40%, #18101a88); }
#prayer form { width: min(92vw, 420px); padding: 19px; background: #120e13ad; backdrop-filter: blur(10px); border: 1px solid #e5c29c70; box-shadow: 0 20px 80px #0008; display: grid; gap: 13px; }
label { font-size: 22px; text-align: center; }
textarea { width: 100%; resize: vertical; min-height: 65px; max-height: 32vh; border: 1px solid #fff4; background: #ffffff0a; color: #fff6e9; padding: 11px; font: 16px Georgia, serif; }
.actions { display: flex; justify-content: flex-end; gap: 10px; }
button { background: #dec19b; color: #241c17; border: 1px solid transparent; border-radius: 3px; padding: 8px 17px; font: 16px Georgia, serif; cursor: pointer; }
button:hover { background: #f0d6b0; }
#prompt:hover { background: #000b; }
:focus-visible { outline: 2px solid #edbe83; outline-offset: 2px; }
#black { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 2.5s ease; }
#ending { position: fixed; inset: 0; background: #000; overflow: auto; display: flex; justify-content: center; align-items: safe center; padding: 44px 25px; }
#poem { white-space: pre-wrap; font: clamp(13px, 1.6vw, 20px) / 1.42 Georgia, serif; max-width: 850px; text-align: center; margin: auto; opacity: 0; transition: opacity 2s ease; }
[hidden] { display: none !important; }
</style>
</head>
<body>
  <main id="game" aria-label="Paysage de L'autel"></main>
  <button id="prompt" type="button" hidden>E pour s’asseoir à l’autel</button>
  <div id="intro">
    <button id="start" type="button" disabled>Commencer</button>
    <div id="loading">
      <progress id="load-progress" max="100" aria-label="Progression du chargement"></progress>
      <div id="load-message" role="status">Chargement du jeu…</div>
    </div>
  </div>
  <section id="prayer" hidden>
    <form id="form" aria-labelledby="prayer-title">
      <label id="prayer-title" for="words">Écrivez votre prière</label>
      <textarea id="words" maxlength="3000" rows="4"></textarea>
      <div class="actions">
        <button type="submit">Prier</button>
      </div>
    </form>
  </section>
  <div id="message" hidden>Votre prière n'a pas été entendue, parce que flemme de coder un truc. Mais par contre, je vous propose ce poème en forme de Pouet (ou de quille, au choix).</div>
  <div id="black"></div>
  <section id="ending" hidden><pre id="poem"></pre></section>
  <script defer src="./game-JMC7RUHE.js"></script>
